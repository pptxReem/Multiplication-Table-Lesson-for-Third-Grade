<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدينة جدول الضرب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a lesson app inside a stone-and-wood city. Wood top bar, district tabs, side street list, stone-edged cards, chunky gold buttons. */
:root{
  --sky:#099DF9;--turq:#43C7F3;--ice:#8FD7F4;--moss:#566F09;--grass:#9DA813;--gold:#F4CF14;
  --orange:#E2812E;--rust:#B04E0D;--wood:#67300C;--stone:#DAB59E;--cream:#FBE4AD;--plum:#AC34CA;
  --ink:#3A1A06;--paper:#FFF7E0;--ok:#566F09;--bad:#B04E0D;--fs:1;
  --display:'Lalezar','Tajawal','Segoe UI',Tahoma,sans-serif;
  --body:'Tajawal','Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--wood);position:relative;color:var(--ink);overflow:hidden;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.app{position:relative;z-index:1;height:100%;width:100%;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:10px;max-width:1600px;margin:0 auto;padding:0}

.page{max-width:1100px;margin:0 auto}
.page.in{animation:pin .35s ease-out}
@keyframes pin{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kick{display:inline-block;padding:2px 14px;border-radius:999px;background:var(--sky);color:#fff;font-weight:800;font-size:calc(13px*var(--fs));margin-bottom:4px}
.ptitle{font:400 calc(36px*var(--fs))/1.3 var(--display);color:var(--wood);margin-bottom:12px;text-wrap:balance}

/* buttons */
.btn{padding:9px 20px;border-radius:14px;font-weight:800;font-size:calc(16px*var(--fs));background:var(--gold);color:var(--wood);border-bottom:4px solid var(--rust);transition:transform .12s,filter .12s;line-height:1.4}
.btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.sky{background:var(--sky);color:#fff;border-bottom-color:#0670B0}
.btn.plum{background:var(--plum);color:#fff;border-bottom-color:#7A2290}
.btn.ghost{background:var(--paper);color:var(--wood);border:2px solid var(--stone);border-bottom-width:4px}
.btn.lg{font-size:calc(21px*var(--fs));padding:12px 28px;font-family:var(--display);font-weight:400}
.bot .btn{padding:8px 18px}

/* layout */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols>div{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--paper);border:3px solid var(--stone);border-radius:20px;padding:14px 18px;box-shadow:0 5px 0 rgba(103,48,12,.2)}
.card.sky{background:#E3F6FD;border-color:var(--turq)}
.card.gold{background:#FFF3B8;border-color:var(--gold)}
.card h3{font:400 calc(23px*var(--fs))/1.4 var(--display);color:var(--rust);margin-bottom:4px}
.card p{margin-bottom:6px}
.card b,.hl{color:var(--rust);font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:calc(14px*var(--fs));color:#7a4a28}
.hero{border-radius:24px;overflow:hidden;border:5px solid var(--wood);box-shadow:0 8px 0 rgba(103,48,12,.3);margin-bottom:16px;background:var(--ice)}
.hero img{display:block;width:100%;height:auto}

/* equations */
.eq{font-family:var(--display);font-weight:400;white-space:nowrap;unicode-bidi:isolate;letter-spacing:.02em}
.qm{display:inline-block;min-width:1.3em;text-align:center;background:var(--gold);color:var(--wood);border-radius:.35em;padding:0 .15em;margin:0 .1em}
.bigeq{font-size:calc(44px*var(--fs));line-height:1.3;text-align:center;color:var(--wood)}
.pill{display:inline-block;padding:2px 14px;border-radius:999px;background:var(--cream);border:2px solid var(--stone);font-weight:800}

/* mascot */
.say{display:flex;gap:12px;align-items:flex-start}
.av{width:68px;height:68px;border-radius:50%;border:4px solid var(--gold);box-shadow:0 4px 0 var(--rust);flex:none;object-fit:cover;background:var(--ice)}
.bub{position:relative;background:#fff;border:3px solid var(--stone);border-radius:18px;padding:8px 14px;flex:1}
.bub:before{content:"";position:absolute;top:22px;right:-11px;width:18px;height:18px;background:#fff;border:3px solid var(--stone);border-width:3px 3px 0 0;transform:rotate(45deg)}

/* controls */
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ctl>span{font-weight:800;min-width:170px}
.rb{width:44px;height:44px;border-radius:12px;background:var(--sky);color:#fff;font:400 30px/1 var(--display);border-bottom:4px solid #0670B0;display:grid;place-items:center;padding-bottom:4px}
.rb:hover{filter:brightness(1.08)}
.rb:active{transform:translateY(2px)}
output.val{font:400 34px/1 var(--display);min-width:48px;text-align:center;color:var(--wood)}
.tg{padding:6px 14px;border-radius:12px;border:3px solid var(--stone);font-weight:800;background:#fff;font-size:calc(17px*var(--fs));min-width:46px;transition:.12s}
.tg:hover{border-color:var(--orange)}
.tg.on{background:var(--wood);border-color:var(--wood);color:var(--gold)}
.tg.em{font-size:26px;padding:3px 10px}
.tchip{min-width:48px;height:48px;border-radius:14px;font:400 26px/1 var(--display);border:3px solid rgba(58,26,6,.25);border-bottom-width:5px;padding-bottom:3px;transition:transform .12s}
.tchip:hover{transform:translateY(-3px)}
.tchip.on{outline:4px solid var(--wood);outline-offset:2px;transform:translateY(-3px)}

/* groups */
.gbox{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:10px;min-height:120px}
.grp{display:flex;flex-wrap:wrap;gap:2px;align-content:center;justify-content:center;width:calc(112px*var(--fs));min-height:68px;padding:6px;border-radius:16px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 20%,#fff);animation:pop .3s ease-out both;font-size:calc(22px*var(--fs));line-height:1.2}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.mission{display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:14px;background:#FFF3B8;border:3px dashed var(--orange);font-weight:700}
.mission.ok{background:#EAF2C6;border:3px solid var(--moss);color:#2F3D04}
.mission .mk{font-size:24px}

/* arrays */
.arr{display:grid;gap:6px;justify-content:center;padding:14px;direction:ltr;min-height:120px}
.arr.turn{animation:turn .5s ease-in-out}
@keyframes turn{50%{transform:rotate(90deg) scale(.8)}to{transform:none}}
.dot{border-radius:50%;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.15);animation:pop .3s ease-out both}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:6px 4px;border:3px dashed var(--stone);border-radius:12px;text-align:center;font-size:calc(22px*var(--fs));color:#b9926f;background:#fff}
.slot.got{border:3px solid var(--moss);background:#EAF2C6;color:var(--wood)}

/* svg boxes */
.svgbox{background:linear-gradient(#BDEBFB,#FFF3D2);border:4px solid #fff;border-radius:22px;box-shadow:inset 0 0 0 2px var(--stone),0 5px 0 rgba(103,48,12,.2);padding:4px}
.svgbox svg{display:block;width:100%;height:auto}
#av{transition:transform .55s cubic-bezier(.3,1.5,.5,1)}

/* tables */
.trow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:4px 10px;border-radius:12px;font-size:calc(26px*var(--fs));border:3px solid transparent;cursor:pointer;margin-bottom:4px;background:#fff}
.trow:hover{border-color:var(--orange)}
.trow.sel{border-color:var(--wood);background:#FFF3B8}
.trow .bar2{height:14px;border-radius:9px;background:var(--c);min-width:8px;transition:width .4s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.trow.ok{background:#EAF2C6;border-color:var(--moss)}
.trow.bad{animation:shake .35s}
input.ans{width:78px;height:40px;border:3px solid var(--stone);border-radius:10px;text-align:center;font:400 24px var(--display);background:#fffdf3;color:var(--wood)}
input.ans:focus{border-color:var(--orange)}
.chain{display:flex;flex-wrap:wrap;gap:6px}
.chain span{padding:2px 12px;border-radius:999px;background:var(--c);color:var(--t);font:400 22px/1.5 var(--display);animation:pop .35s both;animation-delay:calc(var(--i)*.05s)}

/* map */
.mapwrap{overflow-x:auto;padding-bottom:6px}
table.map{border-collapse:separate;border-spacing:3px;margin:0 auto}
table.map th{width:calc(46px*var(--fs));height:calc(40px*var(--fs));border-radius:9px;font:400 calc(21px*var(--fs)) var(--display);background:var(--wood);color:var(--gold)}
table.map th.hot{background:var(--orange);color:#fff}
table.map td button{width:calc(46px*var(--fs));height:calc(40px*var(--fs));border-radius:9px;background:#fff;border:2px solid var(--stone);font:400 calc(19px*var(--fs)) var(--display);color:var(--wood);transition:.1s}
table.map td button:hover{border-color:var(--orange)}
table.map td button.m{background:var(--gold);border-color:var(--orange)}
table.map td button.rc{background:#FFE9A8}
table.map td button.act{background:var(--plum);color:#fff;border-color:var(--wood);transform:scale(1.12)}
table.map td button.mir{background:var(--sky);color:#fff;border-color:var(--wood);transform:scale(1.12)}
.banner{min-height:60px;text-align:center;font-size:calc(20px*var(--fs));padding:8px;background:#fff;border:3px dashed var(--stone);border-radius:16px;margin-bottom:10px;display:flex;flex-direction:column;justify-content:center}

/* flip */
.flips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.flip{perspective:900px;cursor:pointer;min-height:150px;border-radius:18px}
.flip>div{position:relative;width:100%;height:100%;min-height:150px;transition:transform .55s;transform-style:preserve-3d}
.flip.on>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:3px solid var(--wood)}
.flip .f{background:var(--c);color:var(--t);box-shadow:0 5px 0 rgba(103,48,12,.3)}
.flip .f small{font-size:14px;font-weight:700;opacity:.85}
.flip .b{background:#fff;transform:rotateY(180deg);font-size:calc(15px*var(--fs));line-height:1.6}
.flip .f .eq{font-size:34px}
.fgs{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:140px;direction:ltr;margin:8px 0}
.fg{width:38px;height:var(--h);border-radius:19px 19px 8px 8px;background:var(--cream);border:3px solid var(--rust);transition:height .25s,background .25s;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;color:var(--wood)}
.fg:nth-child(5){margin-inline-end:20px}
.fg.fold{height:36px;background:var(--rust);color:var(--cream)}
.fg:hover{filter:brightness(1.07)}

/* quiz */
.q{margin-bottom:14px}
.q .qt{font-weight:800;margin-bottom:8px;font-size:calc(18px*var(--fs))}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
.opt{padding:10px 12px;border:3px solid var(--stone);border-bottom-width:5px;border-radius:14px;background:#fff;font-weight:800;font-size:calc(19px*var(--fs));text-align:center;transition:.12s;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--orange);transform:translateY(-2px)}
.opt.ok{background:#EAF2C6;border-color:var(--moss);color:#2F3D04}
.opt.bad{background:#FBE0D0;border-color:var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
.fb{margin-top:8px;padding:8px 12px;border-radius:12px;font-size:calc(16px*var(--fs))}
.fb.ok{background:#EAF2C6;color:#2F3D04}.fb.bad{background:#FBE0D0;color:#7A3008}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.qbig{font-size:calc(54px*var(--fs));text-align:center;color:var(--wood);line-height:1.3;margin:6px 0 10px}

/* bridge */
.bridge{display:flex;gap:5px;direction:ltr;padding:12px 8px;background:linear-gradient(#BDEBFB 0 55%,#43C7F3 55%);border-radius:18px;border:3px solid var(--wood);margin-bottom:12px;overflow:hidden}
.plank{flex:1;min-width:0;height:54px;border-radius:8px;background:var(--stone);border:3px solid var(--wood);display:grid;place-items:center;font:400 20px var(--display);color:var(--wood);position:relative;transition:background .3s}
.plank.on{background:var(--gold)}
.plank img{position:absolute;width:44px;height:44px;border-radius:50%;border:3px solid var(--plum);top:-30px;object-fit:cover;background:var(--ice)}
.timer{height:16px;border-radius:9px;background:#fff;border:3px solid var(--wood);overflow:hidden;margin-bottom:8px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--grass),var(--orange));transition:width .1s linear}
.res{text-align:center;padding:10px}
.res .big{font:400 calc(64px*var(--fs))/1.2 var(--display);color:var(--rust)}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{perspective:700px;height:92px}
.mc>span{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.up>span,.mc.hit>span{transform:rotateY(180deg)}
.mc .mf,.mc .mb{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:grid;place-items:center;border:3px solid var(--wood)}
.mc .mf{background:var(--wood);color:var(--gold);font:400 44px var(--display);box-shadow:inset 0 0 0 4px var(--rust)}
.mc .mb{background:#fff;transform:rotateY(180deg);font:400 28px var(--display);color:var(--wood)}
.mc.hit .mb{background:#EAF2C6;border-color:var(--moss)}
.mc.hit{animation:hit .5s}
@keyframes hit{50%{transform:scale(1.08)}}

/* problems */
.prob .groups{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.prob .g1{display:flex;flex-wrap:wrap;max-width:128px;padding:4px 8px;border-radius:12px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 18%,#fff);font-size:20px;line-height:1.3}

/* certificate */
.cert{border:10px double var(--wood);border-radius:22px;background:radial-gradient(circle at 50% 0,#fff 0,var(--paper) 60%,var(--cream) 100%);padding:22px 18px;text-align:center;box-shadow:0 8px 0 rgba(103,48,12,.25)}
.cert h2{font:400 calc(40px*var(--fs))/1.3 var(--display);color:var(--rust)}
.cert .nm{font:400 calc(46px*var(--fs))/1.4 var(--display);color:var(--wood);border-bottom:4px dotted var(--stone);display:inline-block;min-width:60%;margin:6px 0}
.seal{width:92px;height:92px;border-radius:50%;margin:8px auto;background:radial-gradient(circle at 35% 30%,#FFF08A,var(--gold) 55%,var(--orange));border:5px solid var(--rust);display:grid;place-items:center;font:400 60px/1 var(--display);color:var(--wood);box-shadow:0 5px 0 rgba(103,48,12,.3);padding-bottom:6px}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
input.nm-in{width:100%;max-width:340px;height:48px;border:3px solid var(--stone);border-radius:12px;padding:0 14px;font:700 20px var(--body);text-align:center;background:#fffdf3;color:var(--wood)}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stamp{border:3px dashed var(--stone);border-radius:16px;padding:10px;text-align:center;font-weight:700;background:#fff;color:#a98a70;line-height:1.5}
.stamp b{display:block;font:400 calc(24px*var(--fs))/1.2 var(--display);color:inherit}
.stamp.got{border:3px solid var(--moss);background:#EAF2C6;color:#2F3D04}
.goals{list-style:none;display:grid;gap:8px}
.goals li{display:flex;gap:10px;align-items:flex-start}
.goals li:before{content:"×";flex:none;width:30px;height:30px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;font:400 24px/1 var(--display);padding-bottom:3px}

/* toast + confetti */
.toast{position:fixed;top:78px;left:50%;transform:translate(-50%,-20px);background:var(--gold);border:3px solid var(--wood);color:var(--wood);font-weight:800;border-radius:999px;padding:8px 22px;z-index:200;opacity:0;transition:.3s;pointer-events:none;font-size:18px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;width:10px;height:15px;z-index:300;pointer-events:none;animation:cf 1.2s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

@media (max-width:900px){
  #menu{display:grid}
  .side{position:absolute;inset-block:6px 0;inset-inline-start:0;z-index:30;box-shadow:8px 0 24px rgba(0,0,0,.3);transform:translateX(110%);transition:.3s;width:260px;background:var(--paper)}
  .side.open{transform:none}
  .ttl small{display:none}.ttl b{font-size:20px}
  .cols{grid-template-columns:1fr}
  .stage{padding:14px 12px 40px}
  .flips{grid-template-columns:1fr 1fr}
  .mem{grid-template-columns:repeat(3,1fr)}
  .top{padding-inline:10px}
  .ctl>span{min-width:100%}
  .trow{grid-template-columns:128px 1fr;font-size:calc(22px*var(--fs))}
}
@media (max-width:520px){
  .ttl,.logo,#fsm,#fsp{display:none}
  .bigeq{font-size:34px}
  .qbig{font-size:42px}
  .flips{grid-template-columns:1fr}
  table.map{border-spacing:2px}table.map th,table.map td button{width:27px;height:30px;font-size:13px;border-radius:7px}table.map td button.act,table.map td button.mir{transform:none}
  .bot .btn{padding:8px 12px}
}

/* ===== مربعات الكلام والبطاقات: لوحات مرحة بشرائط عناوين ===== */
.card{position:relative;background:linear-gradient(180deg,#FFFBEF,#FFF0CC);border:4px solid var(--stone);border-radius:26px;box-shadow:inset 0 0 0 3px #fff,0 6px 0 rgba(103,48,12,.22),0 12px 20px rgba(103,48,12,.1)}
.card.sky{background:linear-gradient(180deg,#F1FBFF,#D5F1FC);border-color:var(--turq)}
.card.gold{background:linear-gradient(180deg,#FFFBD6,#FFF0A0);border-color:var(--gold)}
.card:has(>h3:first-child){margin-top:20px;padding-top:12px}
.card>h3:first-child{display:inline-flex;align-items:center;gap:8px;margin:-34px 0 10px;padding:1px 20px 4px;border-radius:16px;background:linear-gradient(180deg,#8A4519,var(--wood));color:var(--cream);border:3px solid #4A2208;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.25);font-size:calc(22px*var(--fs));transform:rotate(-1.2deg)}
.card>h3:first-child:before{content:"💡";font-size:.95em}
.card.sky>h3:first-child{background:linear-gradient(180deg,#34B4FF,var(--sky));border-color:#0670B0;color:#fff}
.card.sky>h3:first-child:before{content:"🔭"}
.card.gold>h3:first-child{background:linear-gradient(180deg,#7F9A12,var(--moss));border-color:#3B4C05;color:#fff}
.card.gold>h3:first-child:before{content:"⭐"}
.bub{background:radial-gradient(circle at 20% 0,#fff,#FFF6DA);border:4px solid var(--turq);border-radius:24px;padding:10px 18px;box-shadow:0 5px 0 rgba(9,157,249,.28)}
.bub:before{border-color:var(--turq);background:#fff;top:24px;right:-12px;border-width:4px 4px 0 0}
.bub:after{content:"✨";position:absolute;top:-16px;left:14px;font-size:24px;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.25) rotate(12deg)}}
.say .av{width:78px;height:78px}
.ptitle{display:inline-block;padding:2px 26px 6px;border-radius:22px;background:linear-gradient(180deg,#8A4519,var(--wood));color:var(--gold);border:4px solid #4A2208;box-shadow:0 6px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.22);transform:rotate(-.8deg);text-shadow:0 3px 0 rgba(0,0,0,.3);margin-bottom:18px}
.kick{display:block;width:max-content;margin-bottom:8px}

body:after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(143,215,244,.25),rgba(251,228,173,.35));z-index:0;pointer-events:none}
.top{display:flex;align-items:center;gap:10px;min-width:0;margin:10px 12px 0;padding:8px 14px;background:rgba(255,248,226,.96);color:var(--wood);border-radius:28px;border:3px solid #fff;box-shadow:0 5px 0 rgba(103,48,12,.25),0 12px 24px rgba(0,0,0,.18)}
.tabs{display:flex;flex:1;min-width:0;gap:6px;margin:0;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:8px 18px;border-radius:16px;font-weight:800;font-size:17px;background:transparent;color:var(--wood);border:0;white-space:nowrap;transition:.15s}
.tab .ti{font-size:22px}
.tab:hover{background:rgba(218,181,158,.35)}
.tab.on{background:linear-gradient(180deg,#8A4519,var(--wood));color:var(--cream);box-shadow:0 4px 0 #3A1A06,inset 0 2px 0 rgba(255,255,255,.2)}
.tools{display:flex;gap:7px;align-items:center}
.ib{min-width:44px;height:44px;padding:0 8px;border-radius:50%;border:3px solid var(--stone);background:#fff;color:var(--wood);font-weight:800;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(103,48,12,.2)}
.ib:hover{background:var(--cream)}
.ib.off{opacity:.55}
.stars{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:999px;background:var(--gold);color:var(--wood);font-weight:800;font-size:17px;box-shadow:0 3px 0 var(--rust)}
.main{display:flex;min-height:0;position:relative;gap:12px;padding:0 12px}
.stage{flex:1;min-width:0;overflow:auto;position:relative;padding:20px 26px 40px;font-size:calc(17px*var(--fs));line-height:1.85;scroll-behavior:smooth;background:rgba(255,250,236,.88);border-radius:32px;border:3px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.side{width:262px;flex:none;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:9px;background:linear-gradient(180deg,#8A4519,#67300C 40%,#4A2208);border:4px solid #3A1A06;border-radius:32px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.12),0 8px 20px rgba(0,0,0,.3)}
.side.hide{display:none}
.plaque{text-align:center;background:linear-gradient(180deg,#C79A63,#A8763F);border:3px solid #3A1A06;border-radius:20px;padding:8px 10px;line-height:1.2;box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.plaque small{display:block;font-size:14px;font-weight:800;color:#FFF3D6}
.plaque b{font:400 30px/1.2 var(--display);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.stlabel{background:var(--cream);color:var(--wood);border-radius:999px;border:3px solid var(--stone);padding:3px 12px;font-weight:800;text-align:center}
.si{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:8px 10px;border-radius:20px;background:#FFF7E0;border:3px solid var(--stone);box-shadow:0 3px 0 rgba(0,0,0,.25);line-height:1.3;transition:.12s}
.si:hover{transform:translateY(-2px)}
.si .n{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--orange);border:3px solid var(--orange);display:grid;place-items:center;font:400 18px var(--display);flex:none;padding-bottom:2px}
.si b{display:block;font-size:15px;font-weight:800}
.si small{display:block;font-size:12px;color:#8a5a35;font-weight:500}
.si.on{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold),0 3px 0 rgba(0,0,0,.25)}
.si.done .n{background:var(--moss);border-color:var(--moss);color:#fff}
.bot{display:flex;align-items:center;gap:12px;margin:0 12px 10px;padding:8px 14px;background:rgba(255,248,226,.96);color:var(--wood);border-radius:28px;border:3px solid #fff;box-shadow:0 5px 0 rgba(103,48,12,.25),0 12px 24px rgba(0,0,0,.18)}
.dock{display:flex;gap:6px;padding:4px 10px;background:#fff;border-radius:999px;border:3px solid var(--stone)}
.dk{width:42px;height:42px;border-radius:50%;font-size:21px;border:3px solid transparent;display:grid;place-items:center}
.dk:hover{background:var(--cream)}
.dk.on{background:var(--gold);border-color:var(--rust)}
.prog{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}
.prog small{font-size:12px;text-align:center}
.bar{height:12px;border-radius:9px;overflow:hidden;border:2px solid var(--stone)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--orange));transition:width .4s;border-radius:9px}
.prog small{color:#7a4a28}
.bar{background:#EAD7B5}
.laser{position:fixed;width:22px;height:22px;margin:-11px;border-radius:50%;background:radial-gradient(#ff3b3b 30%,rgba(255,59,59,0) 70%);box-shadow:0 0 16px 6px rgba(255,60,60,.6);pointer-events:none;z-index:60;display:none}
#draw{position:absolute;top:0;left:0;z-index:20;pointer-events:none;touch-action:none}
#draw.act{pointer-events:auto;cursor:crosshair}
.thead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.thead .ptitle{display:block;padding:0;margin:0;background:none;border:0;box-shadow:none;transform:none;text-shadow:none;color:var(--wood);font-size:calc(40px*var(--fs))}
.chip{padding:3px 16px;border-radius:999px;background:var(--cream);border:2px solid var(--stone);font-weight:800;font-size:calc(15px*var(--fs));color:var(--wood)}
.chip.g{background:#EAF2C6;border:2px dashed var(--moss);color:#2F3D04}
.banner0{position:relative;margin:0 0 18px}
.banner0 img{display:block;width:100%;height:auto;border-radius:26px;border:5px solid #fff;box-shadow:0 8px 0 rgba(103,48,12,.28)}
.banner0 .startb{position:absolute;bottom:12px;left:12px;white-space:nowrap;box-shadow:0 5px 0 #b8890a,0 8px 14px rgba(0,0,0,.25)}
.banner0 .startb:hover:not(:disabled){transform:translateY(-2px)}
.card.green{background:linear-gradient(180deg,#F6FAE6,#E5EFBD);border-color:var(--grass)}
.card>h3:first-child{margin-inline-start:12px;border-radius:999px;padding:2px 26px 5px;font-size:calc(24px*var(--fs));transform:none}
.card.gold>h3:first-child{background:linear-gradient(180deg,#FFE24A,var(--gold));border-color:#B8960C;color:var(--wood)}
.card.green>h3:first-child{background:linear-gradient(180deg,#7F9A12,var(--moss));border-color:#3B4C05;color:#fff}
.card.green>h3:first-child:before{content:"📖"}
.vocab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vocab .flip{min-height:96px}.vocab .flip>div{min-height:96px}
.vocab .flip .f b{font:400 calc(24px*var(--fs))/1.3 var(--display)}
.vocab .flip .b{font-size:calc(14px*var(--fs));line-height:1.5;padding:6px}
@media (max-width:900px){
  #menu{display:grid}
  .main{padding:0 8px}.top,.bot{margin-inline:8px}
  .tab{padding:6px 12px;font-size:15px}.tab .ti{font-size:18px}
  .side{position:absolute;inset-block:0;inset-inline-start:8px;z-index:30;transform:translateX(120%);transition:.3s;width:250px}
  .side.open{transform:none}
  .stage{padding:14px 12px 30px;border-radius:24px}
  .dock{padding:3px 6px}.dk{width:36px;height:36px;font-size:18px}
}
@media (max-width:520px){
  .card>h3:first-child{font-size:calc(19px*var(--fs));padding:2px 16px 4px;border-radius:18px;margin-inline-start:6px}
  .tab span.tt{display:none}.tab.on span.tt{display:inline}
  .dock{display:none}
  .bot{gap:8px}.thead .ptitle{font-size:calc(30px*var(--fs))}
}

/* v3: صورة أكبر وبطاقات مفردات أفتح */
.p0cols{grid-template-columns:1.35fr 1fr}
.flip .f{background:color-mix(in srgb,var(--c) 26%,#fff);color:var(--wood);border-color:var(--c)}
.flip .f b,.flip .f .eq{color:var(--wood)}
.vocab .flip .f b{font-size:calc(28px*var(--fs))}

.cv{display:grid;place-items:center;width:calc(46px*var(--fs));height:calc(40px*var(--fs));border-radius:9px;background:#fff;border:2px solid var(--stone);font:400 calc(19px*var(--fs)) var(--display);color:var(--wood)}
.cv.y{background:#FFF08A;border-color:var(--gold)}
.cv.x{background:#CFE98A;border-color:var(--moss)}
table.map td input.fc{width:calc(46px*var(--fs));height:calc(40px*var(--fs));border-radius:9px;border:2px solid var(--stone);text-align:center;font:400 calc(19px*var(--fs)) var(--display);color:var(--wood);background:#fff;padding:0}
table.map td input.fc:focus{border-color:var(--orange);background:#FFF9DC}
table.map td input.fc.ok.self{background:#fff;border-color:var(--moss);color:var(--moss)}
table.map td input.fc.ok.mir{background:#D5F1FC;border-color:var(--turq);color:var(--wood)}
table.map td input.fc.ok.fact{background:#FFF3B8;border-color:var(--gold);color:var(--wood)}
table.map td input.fc.bad{animation:shake .35s;border-color:var(--bad)}
table.map.mini{border-spacing:2px}

table.map.smap th{width:auto;min-width:calc(44px*var(--fs));padding:0 6px}
table.map.smap td button{width:calc(60px*var(--fs));height:calc(52px*var(--fs));font-size:calc(28px*var(--fs))}

.exw{display:flex;gap:22px;justify-content:center;align-items:flex-start}

.vm{display:inline-grid;justify-items:end;gap:2px;font:400 calc(30px*var(--fs))/1.3 var(--display);padding:8px 16px;background:#fff;border-radius:16px;border:3px solid var(--stone);margin:6px 0}
.vm hr{width:100%;border:0;border-top:4px solid var(--wood)}
.vm input.ans{width:90px;margin-top:4px}

input.in{border:3px solid var(--stone);border-radius:12px;padding:6px 12px;font:400 24px var(--display);background:#fffdf3;width:110px;text-align:center;color:var(--wood)}
.nb{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--rust);color:#fff;font:400 20px var(--display);margin-inline-end:8px}
.vrow{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.frag{border-collapse:collapse;margin:6px 0}
.frag td{border:2px solid var(--wood);width:calc(54px*var(--fs));height:calc(40px*var(--fs));text-align:center;font:400 calc(22px*var(--fs)) var(--display);background:#fff;color:var(--wood)}
.frag td.f{opacity:.4}.frag td.mid{background:#FFF08A}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fact{background:#fff;border:3px solid var(--stone);border-radius:18px;padding:10px 12px;text-align:center;box-shadow:0 4px 0 rgba(103,48,12,.15)}
.fact .fe{font-size:38px;display:block;line-height:1.3}.fact b{display:block;color:var(--rust);font:400 calc(22px*var(--fs))/1.4 var(--display)}.fact p{font-size:calc(15px*var(--fs));line-height:1.6;margin:0}
.modelwrap{display:flex;justify-content:center;padding:6px;overflow:auto}
.mdlt{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.top2,.side2{font:400 32px/1.2 var(--display);color:var(--wood)}
.top2{border-bottom:5px solid var(--wood);padding:0 18px;min-width:70px;text-align:center}
.mrow{display:flex;align-items:center;gap:12px}
.side2{border-inline-start:5px solid var(--wood);padding-inline-start:12px}
.grid{display:grid;gap:3px}

.ans{margin-top:8px;padding:9px 12px;border-radius:14px;background:#EAF2C6;color:#2F3D04;border:2px solid #b9c98f}

/* ===== v5: أزرار التنقل عائمة مثل موقع التربة (بدون شريط سفلي) ===== */
.app{grid-template-rows:auto minmax(0,1fr)!important}

/* v6: نفس هيكل التربة + خلفية متحركة */

.stage{background:rgba(255,250,236,.58)!important;backdrop-filter:blur(2px)}

body:before{background:radial-gradient(circle at 15% 20%,rgba(244,207,20,.35),transparent 40%),radial-gradient(circle at 85% 75%,rgba(172,52,202,.18),transparent 45%),linear-gradient(160deg,#8FD7F4 0%,#43C7F3 38%,#FBE4AD 100%)!important;filter:none!important;inset:0!important}

/* question generator (bridge, speed, final quiz) */
function genQ(pool){
  const a=pool[ri(0,pool.length-1)],b=ri(2,10),p=a*b,t=ri(0,2);
  const pick=(ans,c)=>{const u=[...new Set(c)].filter(x=>x>0&&x!==ans&&x<=100);return shuffle([ans,...shuffle(u).slice(0,3)])};
  if(t===0)return{q:eq(a,b,null),a:p,o:pick(p,[a*(b+1),a*(b-1),p+1,p-1,p+10,p-10,(a+1)*b,(a-1)*b,a+b])};
  if(t===1)return{q:eq(a,null,p),a:b,o:pick(b,[b+1,b-1,b+2,b-2,a,b+3,b-3])};
  return{q:eq(null,b,p),a:a,o:pick(a,[a+1,a-1,a+2,a-2,b,a+3,a-3])};
}

<div class="row" id="tn" style="margin-bottom:14px">${Array.from({length:10},(_,i)=>`<button class="tchip" data-n="${i+1}" style="${tcs(i+1)}">${N(i+1)}</button>`).join('')}</div>
<div class="cols">
 <div>
  <div class="row" id="md" style="margin-bottom:10px"><button class="tg on" data-m="learn">تعلّم</button><button class="tg" data-m="test">اختبر نفسي</button></div>
  <div id="rows"></div>
 </div>
 <div>
  ${card(`<h3>العدّ بالقفز</h3><div class="chain" id="chain"></div>`)}
  ${card(`<h3>سرّ هذا الجدول</h3><p id="tip"></p>`,'gold')}
  ${card(`<div id="rowtxt" aria-live="polite"><p class="hint">اضغط على أي سطر في وضع التعلّم لترى معناه.</p></div>`,'sky')}
 </div>
</div>`},
init(r){
  let n=3,mode='learn';
  const draw=()=>{
    $$('#tn .tchip',r).forEach(b=>b.classList.toggle('on',+b.dataset.n===n));
    $$('#md .tg',r).forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
    $('#rows',r).innerHTML=card(Array.from({length:10},(_,i)=>{const m=i+1,p=n*m;
      const lhs=mode==='learn'?eq(n,m,p):`<bdi class="eq" dir="ltr">${N(n)}&lrm; × &lrm;${N(m)}&lrm; = &lrm;<input class="ans" inputmode="numeric" autocomplete="off" data-m="${m}" aria-label="${n} × ${m}"></bdi>`;
      return `<div class="trow" data-m="${m}" style="--c:${TC[n][0]}"><span>${lhs}</span><span class="bar2" style="width:${Math.max(2,p/(n*10)*100)}%"></span></div>`}).join(''));
    $('#chain',r).innerHTML=Array.from({length:10},(_,i)=>`<span style="--c:${TC[n][0]};--t:${TC[n][1]};--i:${i}">${N(n*(i+1))}</span>`).join('');
    $('#tip',r).innerHTML=tipTxt(n);
    $('#rowtxt',r).innerHTML=`<p class="hint">${mode==='learn'?'اضغط على أي سطر لترى معناه.':'اكتب الناتج في المربع.'}</p>`;
  };
  const show=m=>{
    $$('.trow',r).forEach(x=>x.classList.toggle('sel',+x.dataset.m===m));
    const p=n*m;$('#rowtxt',r).innerHTML=`<p><b>${grpWord(m)}</b>، في كل مجموعة <b>${N(n)}</b>:</p><div class="bigeq" style="font-size:calc(30px*var(--fs))">${sum(n,m)} = ${N(p)}</div><p>وبالتبديل: ${eq(n,m,p)} و ${eq(m,n,p)}</p>`;
  };
  r.addEventListener('click',e=>{
    const t=e.target.closest('#tn [data-n]');if(t){n=+t.dataset.n;draw();return}
    const m=e.target.closest('#md [data-m]');if(m){mode=m.dataset.m;draw();return}
    const row=e.target.closest('.trow');if(row&&mode==='learn'){show(+row.dataset.m);beep(true)}
  });
  r.addEventListener('input',e=>{
    const inp=e.target.closest('input.ans');if(!inp)return;
    const m=+inp.dataset.m,p=n*m,row=inp.closest('.trow'),v=num(inp.value);
    if(isNaN(v))return;
    if(v===p){row.classList.add('ok');inp.disabled=true;beep(true);
      if($$('.trow',r).every(x=>x.classList.contains('ok')))award('p4_t'+n,1,row)}
    else if(String(v).length>=String(p).length){row.classList.remove('bad');void row.offsetWidth;row.classList.add('bad');beep(false);inp.select()}
  });
  draw();
}});

PAGES.push({ord:6,tab:1,pre:'p5_',n:'خريطة الأنماط',s:'أكتشف الأنماط',t:'أكتشف الأنماط في الجدول',
render(){return `
<div class="cols">
 <div>
  ${card(`<div class="banner" id="bn" aria-live="polite"><span class="hint">اضغط على أي مربع لتعرف عملية الضرب.</span></div>${mtable('map',(r,c)=>`<button data-r="${r}" data-c="${c}" aria-label="${r} ضرب ${c} يساوي ${r*c}">${N(r*c)}</button>`)}`)}
 </div>
 <div>
  ${card(`<h3>لوّن المضاعفات</h3><p>اختر عددًا لتلوّن كل النواتج التي تظهر في جدوله.</p><div class="row" id="mm"><button class="tg on" data-k="0">بدون</button>${[2,3,4,5,6,7,8,9,10].map(k=>`<button class="tg" data-k="${k}">${N(k)}</button>`).join('')}</div>`,'sky')}
  ${mission('m5','المهمة: اضغط على <b>٣ مربعات مختلفة</b> وراقب المربع الأزرق الذي يظهر معها.')}
  ${card(`<h3>اكتشف النمط</h3>
   ${mcq('p5_a','في جدول ضرب ٥ تنتهي النواتج دائمًا بالرقم:',[`${N(5)} أو ${N(0)}`,`${N(2)} أو ${N(7)}`,`${N(3)} أو ${N(8)}`],0,'٥ ، ١٠ ، ١٥ ، ٢٠ ...')}
   ${mcq('p5_b',`إذا كان ${eq(8,4,32)} فإن ${eq(4,8,null)}`,[N(12),N(32),N(36)],1,'المربعان متماثلان على الخريطة.')}`)}
 </div>
</div>`},
init(r){
  let ar=-1,ac2=-1,mk=0;const seen=new Set();
  const t=$('#map',r);
  const paint=()=>{
    $$('button',t).forEach(b=>{const R=+b.dataset.r,C=+b.dataset.c;b.className='';
      if(mk&&(R*C)%mk===0)b.classList.add('m');
      if(ar>=0&&R===ar&&C===ac2)b.classList.add('act');
      else if(ar>=0&&R===ac2&&C===ar&&ar!==ac2)b.classList.add('mir');
      else if(ar>=0&&(R===ar||C===ac2))b.classList.add('rc')});
    $$('th',t).forEach(h=>h.classList.toggle('hot',ar>=0&&((h.dataset.rh!==undefined&&+h.dataset.rh===ar)||(h.dataset.ch!==undefined&&+h.dataset.ch===ac2))));
  };
  r.addEventListener('click',e=>{
    const b=e.target.closest('#map button');
    if(b){ar=+b.dataset.r;ac2=+b.dataset.c;paint();const p=ar*ac2;
      $('#bn',r).innerHTML=ar===ac2?`<div>${eq(ar,ac2,p)}</div><span class="hint">عدد ضربناه في نفسه.</span>`:`<div>${eq(ar,ac2,p)} <span class="hint">و</span> ${eq(ac2,ar,p)}</div><span class="hint">المربع الأزرق هو توأمه: الناتج واحد بعد التبديل.</span>`;
      beep(true);if(ar!==ac2){seen.add(ar+'x'+ac2);if(seen.size>=3){missionDone('m5');award('p5_m',1,b)}}return}
    const k=e.target.closest('#mm [data-k]');
    if(k){mk=+k.dataset.k;$$('#mm .tg',r).forEach(x=>x.classList.toggle('on',x===k));paint()}
  });
}});

PAGES.push({ord:7,tab:1,pre:'p6_',n:'حيل سحرية',s:'أسرار تسهّل الحفظ',t:'حيل سحرية للضرب',
render(){
  const T=[
   [1,'٧ × ١','عدد واحد','<b>٧</b><br>الضرب في ١ يعطينا العدد نفسه.'],
   [10,'٩ × ٠','لا شيء!','<b>٠</b><br>مجموعات فارغة، فلا يوجد شيء نجمعه.'],
   [7,'٦ × ١٠','ضع صفرًا','<b>٦٠</b><br>نضع صفرًا على يمين العدد.'],
   [2,'٧ × ٢','الضعف','<b>١٤</b><br>٧ + ٧ = ١٤، أي ضعف العدد.'],
   [5,'٨ × ٥','نصف العشرة','<b>٤٠</b><br>٨ × ١٠ = ٨٠ ونصفه ٤٠.'],
   [3,'٣ × ٣','المربع','<b>٩</b><br>ثلاث مجموعات في كل منها ثلاثة: ٣ + ٣ + ٣.']];
  const cd=T.map(([t,f,s,b],i)=>`<div class="flip" tabindex="0" role="button" aria-label="اقلب البطاقة" style="--c:${TC[t][0]};--t:${TC[t][1]}"><div><div class="f"><span class="eq">${ltr(dg(f))}</span><small>${s}</small></div><div class="b">${ltrify(dg(b))}</div></div></div>`).join('');
  return `
<div class="cols">
 <div>${card(`<h3>اقلب البطاقات</h3><p>اضغط على كل بطاقة لتكشف السر. اقلب البطاقات الست كلها لتربح نجمة.</p>`,'sky')}
 <div class="flips" style="grid-template-columns:1fr 1fr">${cd}</div></div>
 <div>
  ${card(`<h3>حيلة الأصابع لجدول ٩</h3><p>افرد يديك. لضرب <b>٩ × عدد</b>: اطوِ الإصبع الذي رقمه هو العدد. الأصابع على <b>يسار</b> الإصبع المطوي هي العشرات، وعلى <b>يمينه</b> هي الآحاد.</p>
   <div class="fgs" id="fgs">${Array.from({length:10},(_,i)=>`<button class="fg" data-f="${i+1}" style="--h:${[70,92,104,92,56,56,92,104,92,70][i]}px" aria-label="الإصبع ${i+1}">${N(i+1)}</button>`).join('')}</div>
   <div id="ftxt" aria-live="polite"><p class="hint">اضغط على إصبع لتطويه.</p></div>`,'gold')}
 </div>
</div>`},
init(r){
  const flipped=new Set(),used=new Set();
  r.addEventListener('click',e=>{
    const f=e.target.closest('.flip');
    if(f){f.classList.toggle('on');const i=$$('.flip',r).indexOf(f);flipped.add(i);beep(true);if(flipped.size===6)award('p6_flip',1,f);return}
    const g=e.target.closest('.fg');
    if(g){const n=+g.dataset.f;$$('.fg',r).forEach(x=>x.classList.toggle('fold',x===g));
      $('#ftxt',r).innerHTML=`<p>طويتُ الإصبع رقم <b>${N(n)}</b>. على يساره <b>${N(n-1)}</b> أصابع (عشرات)، وعلى يمينه <b>${N(10-n)}</b> (آحاد).</p><div class="bigeq">${eq(9,n,9*n)}</div>`;
      beep(true);used.add(n);if(used.size>=3)award('p6_nine',1,g)}
  });
  r.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('flip')){e.preventDefault();e.target.click()}});
}});

PAGES.push({ord:19,tab:6,pre:'p8_',n:'لعبة الذاكرة',s:'أطابق وأتذكر',t:'لعبة الذاكرة',
render(){return `
${card(say(`اقلب بطاقتين. إذا كانت إحداهما <b>عملية ضرب</b> والأخرى <b>ناتجها</b> تبقيان مكشوفتين.`))}
<div style="height:14px"></div>
<div class="row" style="margin-bottom:12px"><span class="pill">المحاولات: <b id="mv">٠</b></span><span class="pill">الأزواج: <b id="mt">٠</b> / ${N(6)}</span><button class="btn sky" id="mnew">لعبة جديدة</button></div>
<div class="mem" id="mem"></div>
<div id="mwin" style="margin-top:14px"></div>`},
init(r){
  let first=null,lock=false,moves=0,hits=0,timeouts=[];
  const start=()=>{
    timeouts.forEach(clearTimeout);timeouts=[];first=null;lock=false;moves=0;hits=0;
    const used=new Set(),pairs=[];
    while(pairs.length<6){const a=ri(2,9),b=ri(2,9);if(!used.has(a*b)&&a<=b+3){used.add(a*b);pairs.push([a,b,a*b])}}
    const cs=[];pairs.forEach(([a,b,p],id)=>{cs.push({id,h:ltr(`${N(a)} × ${N(b)}`)});cs.push({id,h:N(p)})});
    $('#mem',r).innerHTML=shuffle(cs).map((c,i)=>`<button class="mc" data-i="${i}" data-id="${c.id}" aria-label="بطاقة"><span><span class="mf">×</span><span class="mb">${c.h}</span></span></button>`).join('');
    $('#mwin',r).innerHTML='';upd();
  };
  const upd=()=>{$('#mv',r).textContent=N(moves);$('#mt',r).textContent=N(hits)};
  r.addEventListener('click',e=>{
    if(e.target.closest('#mnew')){start();return}
    const c=e.target.closest('.mc');if(!c||lock||c.classList.contains('up')||c.classList.contains('hit'))return;
    c.classList.add('up');beep(true);
    if(!first){first=c;return}
    moves++;const a=first;first=null;
    if(a.dataset.id===c.dataset.id){a.classList.replace('up','hit');c.classList.replace('up','hit');hits++;upd();
      if(hits===6){award('p8_win',1,c);if(moves<=12)award('p8_fast',1,c);$('#mwin',r).innerHTML=card(`<div class="res"><div class="big">أحسنت!</div><p>وجدت كل الأزواج في ${N(moves)} محاولة.</p><p class="hint">نجمة إضافية إذا أنهيتها في ${N(12)} محاولة أو أقل.</p><button class="btn lg" id="mnew">لعبة جديدة</button></div>`,'gold')}}
    else{lock=true;upd();timeouts.push(setTimeout(()=>{a.classList.remove('up');c.classList.remove('up');lock=false;beep(false)},900))}
  });
  start();
  return()=>timeouts.forEach(clearTimeout);
}});

init(r){

  const idle=()=>{$('#sg',r).innerHTML=`<div class="res"><p>اختر الجداول، ثم اضغط ابدأ.</p><button class="btn lg" id="go">ابدأ التحدي</button></div>`;$('#tb',r).style.width='100%';$('#sb',r).textContent=N(S.best)};
  const ask=()=>{cur=genQ(pool);$('#sg',r).innerHTML=`<div class="qbig">${cur.q}</div><div class="opts">${optBtns(cur.o)}</div>`};
  const end=()=>{clearInterval(timer);timer=null;cur=null;
    if(score>S.best){S.best=score;store.set('best',score)}
    if(score>=8)award('p9_a',1,$('#sg',r));if(score>=12)award('p9_b',1,$('#sg',r));
    $('#sb',r).textContent=N(S.best);

  r.addEventListener('click',e=>{
    const pc=e.target.closest('#sp [data-p]');
    if(pc&&!timer){pool=pc.dataset.p==='b'?BASIC:ALL;$$('#sp .tg',r).forEach(x=>x.classList.toggle('on',x===pc));return}
    if(e.target.closest('#go')){score=0;left=60;$('#sc',r).textContent=N(0);ask();clearInterval(timer);timer=setInterval(()=>{left-=.1;$('#tb',r).style.width=Math.max(0,left/60*100)+'%';if(left<=0)end()},100);return}
    const o=e.target.closest('#sg .opt');
    if(o&&cur&&timer){if(+o.dataset.v===cur.a){score++;$('#sc',r).textContent=N(score);beep(true);ask()}else{beep(false);o.classList.add('bad');o.disabled=true}}
  });
  idle();
  return()=>clearInterval(timer);
}});

      const task=()=>{$('#gt',r).innerHTML=gi<LM.length?`<p><b>المهمة ${N(gi+1)}:</b> أين <b>${LM[gi][3]}</b>؟ ابحث عنه في الصف ${N(LM[gi][0])} والعمود ${N(LM[gi][1])}.</p>`:'<p><b>أحسنت!</b> وجدت كل الأماكن.</p>'};
      task();
      $('#sa',r).onclick=e=>{const b=e.target.closest('.smap button');if(!b||b.disabled||gi>=LM.length)return;
        const[a,c,em,nm]=LM[gi];if(+b.dataset.r===a&&+b.dataset.c===c){b.textContent=em;b.disabled=true;b.classList.add('okk');beep(true);$('#gm',r).innerHTML=`✔ وجدت ${nm}!`;gi++;if(gi>=3)award('n7c_map',1,b);task()}
        else{beep(false);b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');$('#gm',r).textContent='ليس هنا. تحقق من الصف والعمود.'}};
    }else{$('#sa',r).onclick=null;const[tx,g,k,em]=s.q;const[o,a]=optsFor(g*k,g,k);
      $('#sa',r).innerHTML=`<div class="cols"><div>${card(`<h3>${s.i} ${s.n}</h3><p>${s.link}</p>`,'sky')}</div><div>${card(`<h3>مسألة</h3><div class="prob">${vis(g,k,em)}${mcq('n7c_'+i,dg(tx),o,a,eq(g,k,g*k))}</div>`,'gold')}</div></div>`}
  };
  r.addEventListener('click',e=>{const b=e.target.closest('#sj [data-s]');if(b){$$('#sj .tg',r).forEach(x=>x.classList.toggle('on',x===b));show(+b.dataset.s)}});
  show(0);
}});

PAGES.sort((a,b)=>a.ord-b.ord);
const BK={w_:143,n1_:143,n2_:143,n3_:144,n4_:144,n5_:144,n6a_:144,n6b_:144,n6c_:144};
PAGES.forEach(p=>{if(BK[p.pre])p.bk=BK[p.pre]});

/* ===== shell ===== */
const TABI=['🚩','🔢','🧱','🧠','✅','🔗','🎮','🏆'];
const stage=$('#stage'),cv=$('#draw'),cx=cv.getContext('2d');
let tool='hand',drawing=false,last=null;
function fit(){const w=stage.clientWidth,h=stage.scrollHeight;if(cv.width===w&&cv.height===h)return;const t=document.createElement('canvas');t.width=cv.width;t.height=cv.height;t.getContext('2d').drawImage(cv,0,0);cv.width=w;cv.height=h;cv.style.width=w+'px';cv.style.height=h+'px';cx.drawImage(t,0,0)}
function setTool(t){tool=tool===t?'hand':t;$$('.dk[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===tool));cv.classList.toggle('act',tool==='pen'||tool==='hl');$('#laser').style.display='none';fit()}
function chrome(){
  const p=PAGES[S.page];
  $('#tabs').innerHTML=TABS.map((t,i)=>`<button class="tab ${i===p.tab?'on':''}" data-t="${i}"><span class="ti">${TABI[i]}</span><span class="tt">${t}</span></button>`).join('');
  $('#sidel').innerHTML=PAGES.map((q,i)=>q.tab===p.tab?`<button class="si ${i===S.page?'on':''} ${count(q.pre)?'done':''}" data-go="${i}"><span class="n">${count(q.pre)?'✓':N(i+1)}</span><span><b>${q.n}</b><small>${q.s}</small></span></button>`:'').join('');
  $('#progb').style.width=((S.page+1)/PAGES.length*100)+'%';
  $('#progl').textContent=`الصفحة ${N(S.page+1)} من ${N(PAGES.length)}`;
  $('#prev').disabled=S.page===0;$('#next').disabled=S.page===PAGES.length-1;
  showStars();
}
function go(i){
  i=Math.max(0,Math.min(PAGES.length-1,i));
  if(CLEAN){try{CLEAN()}catch(e){}CLEAN=null}
  S.page=i;store.set('page',i);
  const p=PAGES[i];
  cv.style.width=cv.style.height='0px';cv.width=cv.height=1;
  const old=$('#pg'),fresh=old.cloneNode(false);
  fresh.innerHTML=`<div class="thead"><h1 class="ptitle">${p.t}</h1><span class="chip g">🧭 ${TABS[p.tab]}</span>${p.bk?`<span class="chip">📖 ص ${N(p.bk)}</span>`:''}${p.hands?'<span class="chip" style="background:#FFF3B8;border-color:var(--gold)">🖐️ يدويات</span>':''}</div>`+p.render();
  old.replaceWith(fresh);
  rebind(fresh);restore(fresh);
  stage.scrollTop=0;
  fresh.classList.add('in');
  $('#side').classList.remove('open');
  chrome();
  try{CLEAN=p.init?(p.init(fresh)||null):null}catch(err){console.error(err)}
  fit();
  try{history.replaceState(null,'','#p'+(i+1))}catch(e){}
}
function rebind(el){
  el.addEventListener('input',e=>{const t=e.target.closest('[data-save]');if(t){S.notes[t.dataset.save]=t.value;store.set('notes',S.notes)}});
  el.addEventListener('click',e=>{
    const g=e.target.closest('[data-go]');if(g){go(+g.dataset.go);return}
    const ob=e.target.closest('.openq [data-a]');
    if(ob){const q=ob.closest('.openq'),a=$('.ans',q),k=ob.dataset.a;if(k==='show')a.hidden=false;if(k==='good')award(q.dataset.id,1,ob);if(k==='again'){a.hidden=true;$('textarea',q).focus()}return}
    const op=e.target.closest('.mcq .opt');
    if(op&&!op.disabled){
      const q=op.closest('.mcq'),c=+q.dataset.c,i=+op.dataset.i,fb=$('.fb',q);
      if(i===c){$$('.opt',q).forEach(b=>b.disabled=true);op.classList.add('ok');fb.hidden=false;fb.className='fb ok';fb.innerHTML='✔ إجابة صحيحة! '+(fb.dataset.why||'');beep(true);if(!q._bad)award(q.dataset.id,1,op);else confetti(op)}
      else{q._bad=1;op.classList.add('bad');op.disabled=true;beep(false);fb.hidden=false;fb.className='fb bad';fb.textContent='✘ حاول مرة أخرى، أنت قريب!'}
    }
  });
}
function init(){
  document.documentElement.style.setProperty('--fs',S.fs);
  $('#snd').textContent=S.snd?'🔊':'🔇';$('#snd').classList.toggle('off',!S.snd);
  $('#digits').textContent=S.hi?'123':'١٢٣';
  $('#tabs').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){const f=PAGES.findIndex(p=>p.tab===+t.dataset.t);go(f)}});
  $('#sidel').addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(+g.dataset.go)});
  $('#prev').onclick=()=>go(S.page-1);$('#next').onclick=()=>go(S.page+1);
  $('#menu').onclick=()=>{const sd=$('#side');if(innerWidth>900){sd.classList.toggle('hide');document.body.classList.toggle('sbhide',sd.classList.contains('hide'))}else sd.classList.toggle('open');setTimeout(fit,50)};
  $$('.dk[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
  $('#clr').onclick=()=>cx.clearRect(0,0,cv.width,cv.height);
  $('#fs').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>toast('المتصفح لا يسمح بملء الشاشة هنا'))}catch(e){toast('المتصفح لا يسمح بملء الشاشة هنا')}};
  const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  const stroke=(a,b)=>{cx.save();cx.lineCap='round';cx.lineJoin='round';if(tool==='hl'){cx.globalAlpha=.35;cx.strokeStyle='#F4CF14';cx.lineWidth=24}else{cx.strokeStyle='#D32F2F';cx.lineWidth=4}cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();cx.restore()};
  cv.addEventListener('pointerdown',e=>{if(tool!=='pen'&&tool!=='hl')return;fit();drawing=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}last=pt(e);stroke(last,last)});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);stroke(last,p);last=p});
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{drawing=false}));
  stage.addEventListener('pointermove',e=>{if(tool==='laser'){const l=$('#laser');l.style.display='block';l.style.left=e.clientX+'px';l.style.top=e.clientY+'px'}});
  stage.addEventListener('pointerleave',()=>{$('#laser').style.display='none'});
  window.addEventListener('resize',fit);
  $('#fsp').onclick=()=>{S.fs=Math.min(1.3,+(S.fs+.1).toFixed(2));store.set('fs',S.fs);document.documentElement.style.setProperty('--fs',S.fs)};
  $('#fsm').onclick=()=>{S.fs=Math.max(.85,+(S.fs-.1).toFixed(2));store.set('fs',S.fs);document.documentElement.style.setProperty('--fs',S.fs)};
  $('#snd').onclick=()=>{S.snd=!S.snd;store.set('snd',S.snd);$('#snd').textContent=S.snd?'🔊':'🔇';$('#snd').classList.toggle('off',!S.snd)};
  $('#digits').onclick=()=>{S.hi=!S.hi;store.set('hi',S.hi);$('#digits').textContent=S.hi?'123':'١٢٣';go(S.page)};
  document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowLeft')go(S.page+1);if(e.key==='ArrowRight')go(S.page-1)});
  const m=/^#p(\d+)$/.exec(location.hash||'');
  go(m?+m[1]-1:S.page);
  window.addEventListener('hashchange',()=>{const m=/^#p(\d+)$/.exec(location.hash||'');if(m&&+m[1]-1!==S.page)go(+m[1]-1)});
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({page:S.page,stars:S.stars,done:S.done,name:S.name,best:S.best,qs:S.qs}));
const boot=d=>{if(d&&typeof d.page==='number'&&d.done){Object.assign(S,d)}init()};
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data);
})();
</script>
<script>
(function(){try{var h=document.createElement('div');h.id='mbg';h.setAttribute('aria-hidden','true');
var S=['٢','٣','٤','٥','٦','٧','٨','٩','×','×','÷','+','−','=','٢×٣','٤×٥','٣×٦','٧×٨','٩×٩','٦×٤','٥×٥','١٠','١٢','٢٤','٣٠','٤٢','٥٦','٨١'];
var C=['#099DF9','#43C7F3','#9DA813','#F4CF14','#E2812E','#AC34CA','#566F09','#B04E0D'];
var f=document.createDocumentFragment();
for(var n=0;n<34;n++){var e=document.createElement('i');var big=Math.random()<.3;var sz=big?70+Math.random()*50:30+Math.random()*34;
e.textContent=S[Math.floor(Math.random()*S.length)];
var st=e.style;st.left=(Math.random()*96)+'vw';st.setProperty('--sz',sz+'px');st.setProperty('--c',C[Math.floor(Math.random()*C.length)]);
st.setProperty('--o',(big?.2:.26)+Math.random()*.1);st.setProperty('--d',(22+Math.random()*26)+'s');st.setProperty('--dl',(-Math.random()*40)+'s');
st.setProperty('--x',(14+Math.random()*40)+'px');st.setProperty('--r0',(Math.random()*40-20)+'deg');st.setProperty('--r1',(Math.random()*50-25)+'deg');st.setProperty('--y',(Math.random()*90)+'vh');
f.appendChild(e)}
h.appendChild(f);document.body.insertBefore(h,document.body.firstChild)}catch(_){}})();
</script>
